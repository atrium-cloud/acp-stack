# KILO_API_KEY is the Kilo CLI's key: it authenticates the `kilo` Kilo Gateway
# provider (OpenCode routing) and is also scoped to the `kilo` agent. Distinct
# from KILOCODE_API_KEY above, which keys the `kilocode` provider (Hermes).
[[api_keys]]
env_var = "KILO_API_KEY"
provider_ids = ["kilo"]
agent_ids = ["kilo"]
companion_env_vars = []
optional_env_vars = []

