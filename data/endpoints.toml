# Per-model wire shapes for providers whose model listings carry no wire
# metadata: the OpenAI-style `GET /v1/models` listings return plain id-only
# entries, so the wire each model speaks is mirrored from the provider docs
# instead. Scoped to OpenCode Zen/Go today.
#
# Mirrored from:
# [OpenCode Zen Docs - Endpoints](https://opencode.ai/docs/zen/#endpoints)
# [OpenCode Go Docs - Endpoints](https://opencode.ai/docs/go/#endpoints)
# Mirrored on 2026-08-20
#
# Refresh ritual: re-check those two pages when Zen/Go rotate models.
#
# The wire vocabulary is agent-neutral: chat_completions | anthropic_messages
# | responses | google. `default` documents the listing's fallback wire, so
# models on the default wire need no entry; the provisioning fallback itself
# stays in providers.toml (`[providers.hermes].api_mode`) so there is exactly
# one source of truth for it.

[opencode]
default = "chat_completions"

[opencode.models]
"claude-fable-5" = "anthropic_messages"
"claude-opus-5" = "anthropic_messages"
"claude-opus-4-8" = "anthropic_messages"
