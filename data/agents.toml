# Hermes Agent

[[agents]]
id = "hermes"
name = "Hermes Agent"
kind = "adapter"
headless_compatible = true
# The upstream registry index lists neither Hermes nor this org's
# hermes-agent-acp adapter (the sync id); remove once upstream lists the adapter.
sync_exempt = true
set_provider = true
set_model = true
allow_custom_provider = true
set_provider_base_url = true
allow_custom_model = true
# The hermes-agent-acp adapter advertises ACP v1 session modes on session/new:
# `default` and `dont_ask` (a per-session approval bypass).
set_mode = true
supports_agent_skills = true
agent_skills_install_dir = "~/.agents/skills"
# Hermes only discovers ~/.hermes/skills, so managed skills are symlinked there.
agent_skills_link_dir = "~/.hermes/skills"
stdio_framing = "json-lines"
website = "https://hermes-agent.nousresearch.com"
support_doc = "docs/agents/hermes.md"
testflight_prompt = "Use your file-writing tool to create a file at the relative path .acp-stack-testflight.txt in your current working directory, containing exactly this text: acp-stack testflight ok. Actually write the file to disk; a reply describing the action without writing the file is a failure."
testflight_expect_fs = ".acp-stack-testflight.txt"

# Node script that drives `hermes serve`.
[agents.adapter]
# Not `hermes-acp`: Hermes' own installer and uninstaller own that name.
id = "hermes-agent-acp"
github = "atrium-cloud/hermes-acp"

# Hermes brings no Node, so the recipe provides it.
[agents.adapter.install.shell]
script = '''
set -eu
managed_bin="${HOME}/.local/bin"
managed_adapter="${managed_bin}/hermes-agent-acp"
mkdir -p "$managed_bin"
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT INT TERM
node_ready() {
    command -v node >/dev/null 2>&1 || return 1
    node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 22 ? 0 : 1)'
}
if ! node_ready; then
    case "$(uname -m)" in
        x86_64) node_arch="x64" ;;
        aarch64 | arm64) node_arch="arm64" ;;
        *) echo "no Node.js 22 build for $(uname -m)" >&2; exit 1 ;;
    esac
    node_root="${HOME}/.local/share/acp-stack/node"
    sums="$(curl -fsSL https://nodejs.org/dist/latest-v22.x/SHASUMS256.txt)"
    archive="$(printf '%s\n' "$sums" | grep -o "node-v[0-9.]*-linux-${node_arch}\.tar\.gz" | head -n 1)"
    test -n "$archive"
    curl -fsSL "https://nodejs.org/dist/latest-v22.x/${archive}" -o "${work}/${archive}"
    expected="$(printf '%s\n' "$sums" | grep " ${archive}\$" | cut -d ' ' -f 1)"
    printf '%s  %s\n' "$expected" "${work}/${archive}" | sha256sum -c - >/dev/null
    tar -xzf "${work}/${archive}" -C "$work"
    mkdir -p "$node_root"
    # Concurrent recipes share this root: lossy rename claim, atomic `current`.
    release="${node_root}/${archive%.tar.gz}"
    mv "${work}/${archive%.tar.gz}" "$release" 2>/dev/null || test -d "$release"
    ln -s "$release" "${node_root}/current.${$}"
    mv -T "${node_root}/current.${$}" "${node_root}/current"
    for tool in node npm npx; do
        ln -sf "${node_root}/current/bin/${tool}" "${managed_bin}/${tool}"
    done
    PATH="${managed_bin}:${PATH}"
    export PATH
    node_ready
fi
curl -fsSL https://github.com/atrium-cloud/hermes-acp/releases/latest/download/hermes-agent-acp.zip -o "${work}/hermes-agent-acp.zip"
unzip -q -o "${work}/hermes-agent-acp.zip" hermes-agent-acp -d "$work"
if [ -f "$managed_adapter" ] && cmp -s "${work}/hermes-agent-acp" "$managed_adapter"; then
    echo "hermes-agent-acp unchanged; keeping the installed bundle" >&2
else
    install -m 0755 "${work}/hermes-agent-acp" "$managed_adapter"
fi
test -x "$managed_adapter"
'''
creates = "hermes-agent-acp"
required_tools = ["curl", "unzip", "tar", "sha256sum"]

[agents.adapter.update]
shell_rerun = true

[agents.harness]
id = "hermes"

[agents.harness.install.shell]
script = '''
set -eu
managed_bin="${HOME}/.local/bin"
managed_hermes="${managed_bin}/hermes"
hermes_home="${HOME}/.hermes"
hermes_src="${hermes_home}/hermes-agent"
mkdir -p "$managed_bin"
# Fetch to a file rather than piping into bash so the installer keeps the
# runtime's empty stdin (no prompt can consume the script body) and a curl
# failure is fatal without pipefail. The script is ~150KB and fetches in
# under a second from a healthy host, so a fetch still going at 15s means a
# dead host -- fail over to the official GitHub-hosted installer rather than
# burn the install-step budget (the Hermes release ships no binary assets,
# so a release-asset fallback is not possible).
installer="$(mktemp)"
trap 'rm -f "$installer"' EXIT INT TERM
fetch_installer() {
    curl -fsSL --connect-timeout 10 --max-time 15 "$1" -o "$installer" && test -s "$installer"
}
if ! fetch_installer https://hermes-agent.nousresearch.com/install.sh; then
    echo "vendor installer download failed; falling back to the GitHub-hosted installer" >&2
    fetch_installer https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh
fi
# --skip-browser does not skip the upstream Computer Use install, which has
# its own long timeout; --skip-computer-use does. --dir/--hermes-home keep
# root installs off the upstream FHS layout (/usr/local/lib + /usr/local/bin)
# so the managed paths asserted below stay accurate for every user.
bash "$installer" --skip-setup --skip-browser --skip-computer-use --non-interactive --dir "$hermes_src" --hermes-home "$hermes_home" </dev/null
# The adapter drives `hermes serve`, so the base binary is all that is needed.
test -x "$managed_hermes"
'''
creates = "hermes"
required_tools = ["curl", "bash", "git"]

