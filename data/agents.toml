# Hermes Agent

[[agents]]
id = "hermes"
name = "Hermes Agent"
kind = "native"
headless_compatible = true
# Documented on the ACP agents page but absent from the upstream registry
# index; remove once upstream lists it.
sync_exempt = true
set_provider = true
set_model = true
allow_custom_provider = true
set_provider_base_url = true
allow_custom_model = true
# Hermes exposes modes only through the pre-1.0 `modes` session state, which
# this runtime does not read (ACP v1 configOptions only), so mode selection
# stays off until upstream advertises configOptions.
set_mode = false
supports_agent_skills = true
agent_skills_install_dir = "~/.agents/skills"
# Hermes only discovers ~/.hermes/skills, so managed skills are symlinked there.
agent_skills_link_dir = "~/.hermes/skills"
stdio_framing = "json-lines"
website = "https://hermes-agent.nousresearch.com"
support_doc = "docs/agents/hermes.md"
testflight_prompt = "Create a file named .acp-stack-testflight.txt in the current workspace containing exactly: acp-stack testflight ok"
testflight_expect_fs = ".acp-stack-testflight.txt"

[agents.harness]
id = "hermes"

[agents.harness.install.shell]
script = '''
set -eu
managed_bin="${HOME}/.local/bin"
managed_hermes="${managed_bin}/hermes"
hermes_home="${HOME}/.hermes"
hermes_src="${hermes_home}/hermes-agent"
mkdir -p "$managed_bin"
# Fetch to a file rather than piping into bash so the installer keeps the
# runtime's empty stdin (no prompt can consume the script body) and a curl
# failure is fatal without pipefail. The script is ~150KB and fetches in
# under a second from a healthy host, so a fetch still going at 15s means a
# dead host -- fail over to the official GitHub-hosted installer rather than
# burn the install-step budget (the Hermes release ships no binary assets,
# so a release-asset fallback is not possible).
installer="$(mktemp)"
trap 'rm -f "$installer"' EXIT INT TERM
fetch_installer() {
    curl -fsSL --connect-timeout 10 --max-time 15 "$1" -o "$installer" && test -s "$installer"
}
if ! fetch_installer https://hermes-agent.nousresearch.com/install.sh; then
    echo "vendor installer download failed; falling back to the GitHub-hosted installer" >&2
    fetch_installer https://raw.githubusercontent.com/NousResearch/hermes-agent/main/scripts/install.sh
fi
# --skip-browser does not skip the upstream Computer Use install, which has
# its own long timeout; --skip-computer-use does. --dir/--hermes-home keep
# root installs off the upstream FHS layout (/usr/local/lib + /usr/local/bin)
# so the managed paths asserted below stay accurate for every user.
bash "$installer" --skip-setup --skip-browser --skip-computer-use --non-interactive --dir "$hermes_src" --hermes-home "$hermes_home" </dev/null
test -x "$managed_hermes"
# Current installers bundle ACP mode; older ones need the optional extra
# installed into the checkout's venv, so only reach for uv when the ACP
# entry point is missing.
if ! "$managed_hermes" acp --version </dev/null >/dev/null 2>&1; then
    echo "hermes acp entry point missing; installing the optional .[acp] extra" >&2
    test -d "$hermes_src"
    uv_bin="$(command -v uv || printf '%s' "${HOME}/.hermes/bin/uv")"
    test -x "$uv_bin"
    (cd "$hermes_src" && VIRTUAL_ENV="${hermes_src}/venv" "$uv_bin" pip install -e '.[acp]')
fi
"$managed_hermes" acp --version </dev/null >/dev/null
'''
creates = "hermes"
required_tools = ["curl", "bash", "git"]

# Cline

[[agents]]
id = "cline"
name = "Cline"
kind = "native"
headless_compatible = true
# ACP mode resolves provider/model from CLINE_PROVIDER/CLINE_MODEL env vars and
# locks the provider when set, so acps leaves provider selection to the env.
set_provider = false
set_model = true
allow_custom_provider = false
allow_custom_model = false
set_mode = true # plan, act
supports_agent_skills = true
# Cline discovers ~/.agents/skills natively (SDK skill search paths), so no
# registry link directory is needed.
agent_skills_install_dir = "~/.agents/skills"
stdio_framing = "json-lines"
website = "https://cline.bot"
github = "cline/cline"
support_doc = "docs/agents/cline.md"
testflight_prompt = "Create a file named .acp-stack-testflight.txt in the current workspace containing exactly: acp-stack testflight ok"
testflight_expect_fs = ".acp-stack-testflight.txt"

[agents.harness]
id = "cline"
# Cline enters ACP mode through a flag, not the usual `acp` subcommand.
acp_args = ["--acp"]

[agents.harness.install.npm]
package = "cline"
creates = "cline"

# Kilo Code

