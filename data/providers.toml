[[providers]]
id = ["kimi-coding", "kimi-for-coding", "kimi-coding-plan", "kimi", "kimi-code"]
name = "Kimi For Coding"
agents = ["pi", "opencode", "claude-code", "hermes", "kimi"]
base_url = "https://api.kimi.com/coding/v1"
# No models_url: probed 2026-08-20 with a real subscription key — the coding
# surface has no model-list route (/coding/* variants all 404) and the platform
# /v1/models rejects coding-plan keys with 401.

# Kimi For Coding's Claude Code endpoint speaks Anthropic Messages at the
# /coding/ root (no /anthropic suffix). Tier-universal defaults: the
# `kimi-for-coding` model and 256K windows are available on every plan;
# higher tiers can pin k3-256k (Moderato tier and up) or k3[1m] (1M
# context, Allegretto tier and up) per the Kimi Code docs.
[providers.claude_code]
base_url = "https://api.kimi.com/coding/"
default_model = "kimi-for-coding"
set_subagent_model = true
env = { CLAUDE_CODE_EFFORT_LEVEL = "high", CLAUDE_CODE_AUTO_COMPACT_WINDOW = "262144", CLAUDE_CODE_MAX_CONTEXT_TOKENS = "262144" }

[providers.provider_ids]
kimi-coding = "pi"
kimi-for-coding = "opencode"
kimi-coding-plan = "claude-code"
kimi = "hermes"
kimi-code = "kimi"

[providers.hermes]
api_mode = "anthropic_messages"

[providers.base_urls]
pi = "https://api.kimi.com/coding"
hermes = "https://api.kimi.com/coding"

