# Provider compatibility metadata.
#
# Curated from:
# [OpenCode Docs - Providers](https://opencode.ai/docs/providers/)
# [Pi Agent Docs - Providers](https://github.com/earendil-works/pi/blob/main/packages/coding-agent/docs/providers.md)
# [Amp manual](https://ampcode.com/manual)
# [models.dev](https://models.dev/api.json)
# [Hermes Agent providers docs](https://hermes-agent.nousresearch.com/docs/integrations/providers)
# Last updated on 2026-08-20
#
# A `[providers.claude_code]` sub-table carries Claude Code-specific headless
# provisioning metadata (endpoint, model defaults, env). When the sub-table
# omits companion_env_vars/optional_env_vars, lookups fall back to the
# provider-level and env_vars.toml lists.
#
# A `[providers.hermes]` sub-table carries Hermes-specific provisioning
# metadata: `api_mode` is the wire transport (`chat_completions`,
# `anthropic_messages`, or `codex_responses`) declared on the managed
# named-provider entry acp-stack writes when an endpoint override reroutes
# the provider. Every hermes-enabled provider must declare the sub-table;
# omitting `api_mode` marks the pair as unable to carry an override. A
# provider listed in HERMES_PROVIDER_BASE_URL_ENV
# (src/runtime/agent/provider_keys.rs) instead carries its override in the
# base-URL env var its native hermes overlay declares, and keeps its native
# id; the managed entry is the fallback for the rest.
#
# `base_url` is the vendor endpoint base most agents send the provider's
# traffic to (models.dev `api`, or the agent SDK default). A managed-state
# endpoint override keeps its path and replaces its origin, so a row without
# one cannot be rerouted. `[providers.base_urls]` overrides it per agent id
# where an agent's client expects a different path (pi and hermes Anthropic
# clients append `/v1/messages` themselves). Claude Code lanes use the
# `[providers.claude_code]` base_url; Kimi lanes are fixed in the runtime.
#
# `models_url` is the provider's OpenAI-compatible model listing endpoint:
# `GET <models_url>` with `Authorization: Bearer <api key>` returning
# `{"data": [{"id": ..., "name"?: ...}]}`. It backs live model-catalog
# fetches; providers whose listing API differs simply omit the field. Only
# declare it after a verified live fetch against the endpoint.

[[providers]]
id = ["anthropic"]
name = "Anthropic"
agents = ["pi", "opencode", "goose", "claude-code", "hermes"]
base_url = "https://api.anthropic.com/v1"

# First-party Anthropic API needs no provisioning extras; the empty sub-table
# marks the provider as Claude Code-profiled.
[providers.claude_code]

[providers.hermes]
api_mode = "anthropic_messages"

[providers.base_urls]
pi = "https://api.anthropic.com"
hermes = "https://api.anthropic.com"

