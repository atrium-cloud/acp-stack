# Hermes-only providers from the Hermes Agent providers doc
# (https://hermes-agent.nousresearch.com/docs/integrations/providers).
# Hermes-documented providers deliberately not tagged for hermes:
# - github-copilot (Hermes auth is OAuth device flow / GitHub tokens; no plain API key)
# - google-vertex, amazon-bedrock (OAuth2/service-account and AWS credential chains; no acps-managed API key and no hermes native-auth path)
# - lmstudio (local server with optional LM_API_KEY only; no canonical key to provision)
# - zhipuai, zai-coding-plan (no such Hermes provider ids; Hermes' single `zai` provider auto-probes the global/China/coding endpoints)
# - moonshotai, moonshotai-cn (Hermes reaches the Moonshot platform as `kimi-coding`/`kimi-coding-cn` with KIMI_API_KEY; `moonshotai`/`MOONSHOT_API_KEY` are not recognized)
# - microsoft-foundry, azure-foundry (Hermes azure-foundry needs endpoint+key config beyond id+key; microsoft-foundry is the Anthropic-Foundry endpoint)
# - mistral, groq, cerebras, together (not explicitly documented by Hermes; reachable only via its generic custom endpoint)
# - Nous Portal, qwen-oauth, minimax-oauth, xAI OAuth (OAuth-only; acp-stack provisions API keys only)

