name = "Kimi For Coding (Global)"
agents = ["kimi"]
base_url = "https://api.kimi.ai/coding/v1"
# Global-region subscription endpoint (api.kimi.ai); same coding surface as
# the mainland row, so it shares the KIMI_API_KEY credential and has no
