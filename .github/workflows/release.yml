name: release

# Builds and publishes the Linux release artifacts on GitHub's runners. A single
# Linux job cross-compiles both arches via cargo-zigbuild (glibc 2.17 floor),
# reusing scripts/build-release.sh verbatim, then publishes the tarballs to the
# configured release hosting service over GitHub OIDC and attaches the tarballs
# + SHA256SUMS + install.sh + acps-release.json (the self-updater manifest) to
# the GitHub Release.
#
# Normal flow: cut a release with scripts/release.sh --push.
# Retry a failed run with GitHub's "re-run failed jobs" (it keeps the
# refs/tags/* ref and push event the hosting service's publisher trust policy
# requires). The workflow_dispatch path re-runs a build for an already-pushed
# tag; dispatch with the tag as the run ref or publication is rejected.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.1.0); dispatch with the tag as the run ref"
        required: true

permissions:
  contents: write
  id-token: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # rust-toolchain.toml pins 1.99.1; install it and the cross targets here so
      # build-release.sh's own `rustup target add` is a no-op on the runner.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Validate tag and package version
        run: |
          set -euo pipefail
          version="$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f 2)"
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "invalid release tag: $RELEASE_TAG" >&2; exit 1; }
          test "$RELEASE_TAG" = "v$version"

      - uses: mlugg/setup-zig@v2
        with:
          version: latest

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build release artifacts
        run: bash scripts/build-release.sh

      # Publishes to the release hosting service configured through repository
      # variables. Forks without those variables skip publication and keep the
      # GitHub Release flow only.
      - name: Publish release artifacts
        if: vars.PUBLISH_BASE_URL != ''
        env:
          PUBLISH_BASE_URL: ${{ vars.PUBLISH_BASE_URL }}
          PUBLISH_OIDC_AUDIENCE: ${{ vars.PUBLISH_OIDC_AUDIENCE }}
          PUBLISH_RUNTIME_PROFILE: ${{ vars.PUBLISH_RUNTIME_PROFILE }}
        run: bash scripts/publish-release.sh dist/acps-release.json acp-stack "$RELEASE_TAG"

      # A minor release (patch 0) pairs the tag with its curated changelog;
      # patch releases carry the generated notes only.
      - name: Prepare release notes
        id: notes
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG##*.}" == "0" ]]; then
            echo "body_path=docs/changelogs/${RELEASE_TAG}.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # The published `/v1` JSON Schema is attached to every release from its
          # drift-tested committed copy (no runner-side regeneration). The fixed
          # asset name keeps `releases/latest/download/acps-schema.json` stable;
          # `latest` is the newest non-prerelease, so it always serves the newest
          # stable schema. Consumers that need a specific version read the raw
          # committed file at that release's tag instead.
          files: |
            dist/acp-stack-*.tar.gz
            dist/SHA256SUMS
            dist/install.sh
            dist/acps-release.json
            docs/specs/api/acps-schema.json
            docs/specs/api/acps-schema.meta.json
          body_path: ${{ steps.notes.outputs.body_path }}
          generate_release_notes: true
